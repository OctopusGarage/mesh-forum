name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: forum-ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  rust:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install pinned toolchain
        shell: bash
        run: |
          rustup show active-toolchain
          rustup component add rustfmt clippy
      - run: cargo fmt --all --check
      - run: cargo test --locked --lib --tests
      - run: cargo clippy --locked --all-targets -- -D warnings
      - name: Test native desktop code without foreground automation
        if: runner.os == 'macOS'
        run: cargo test --locked --features desktop
      - name: Check desktop targets
        if: runner.os == 'macOS'
        run: cargo clippy --locked --all-targets --features desktop -- -D warnings
      - name: Diagnose macOS discovery failure
        if: failure() && runner.os == 'macOS'
        run: |
          ifconfig -a
          netstat -rn -f inet
