[package]
name = "mesh-forum"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
mesh-blob = { package = "mesh-foundation-blob", version = "=0.1.0-alpha.2", features = ["mesh-connect"] }

mesh-identity = { package = "mesh-foundation-identity", version = "=0.1.0-alpha.2" }
bincode = "1.3"
sha2 = "0.10"
hex = "0.4"
tempfile = "3"
serde = { version = "1", features = ["derive"] }

mesh-connect = { package = "mesh-foundation-connect", version = "=0.1.0-alpha.2" }
tokio = { version = "1", features = ["io-util", "macros", "net", "rt-multi-thread", "sync", "time"] }
mesh-storage = { package = "mesh-foundation-storage", version = "=0.1.0-alpha.2" }
zeroize = "1"

[dev-dependencies]
mesh-replication = { package = "mesh-foundation-replication", version = "=0.1.0-alpha.2", features = ["mesh-connect"] }
x25519-dalek = { version = "2", features = ["static_secrets"] }

mesh-e2ee = { package = "mesh-foundation-e2ee", version = "=0.1.0-alpha.2" }
mesh-mailbox = { package = "mesh-foundation-mailbox", version = "=0.1.0-alpha.2" }

[workspace]

[target.'cfg(target_os = "macos")'.dependencies]
gpui-kit = { version = "=0.11.0", optional = true }
objc2 = { version = "0.6", optional = true }
objc2-app-kit = { version = "0.3", optional = true, default-features = false, features = ["NSAccessibility", "NSApplication", "NSImage", "NSWorkspace"] }
objc2-foundation = { version = "0.3", optional = true, default-features = false, features = ["NSData", "NSLocale"] }
gpui-pre-macos = { version = "=0.3.14", optional = true, features = ["test-support"] }

[features]
desktop = ["dep:gpui-kit", "dep:objc2", "dep:objc2-app-kit", "dep:objc2-foundation"]
desktop-visual = ["desktop", "dep:gpui-pre-macos"]

[[bin]]
name = "mesh-forum-desktop"
path = "src/desktop/main.rs"
required-features = ["desktop"]
